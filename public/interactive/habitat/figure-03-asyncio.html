              <h2 class="diagram-title" id="_r_l_">
                Concurrency is not CPU parallelism
              </h2>
              <p class="diagram-subtitle">
                Python asyncio allows concurrent request processing, but only a
                single request executes on the CPU thread at a time. This has
                high impact on request latencies when there's a lot of CPU work
                to be done.
              </p>
