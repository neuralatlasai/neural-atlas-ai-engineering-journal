          <div class="pool-explanation">
            <p data-pool-narrative="true">
              C receives a disproportionate share of subsequent requests from
              every process that connects to it.
            </p>
            <p aria-hidden="true" class="pool-narrative-space">
              An initial burst reaches A, B, and the slower process C.
            </p>
            <p aria-hidden="true" class="pool-narrative-space">
              A and B return connections first. C’s connections return later.
            </p>
            <p aria-hidden="true" class="pool-narrative-space">
              LIFO picks the most recently returned connection, repeatedly
              sending new work back to C.
            </p>
            <p aria-hidden="true" class="pool-narrative-space">
              C receives a disproportionate share of subsequent requests from
              every process that connects to it.
