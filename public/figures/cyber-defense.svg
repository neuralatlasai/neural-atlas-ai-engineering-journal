<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" class="atlas-diagram" role="img" aria-labelledby="cyber-defense-title cyber-defense-desc"><title id="cyber-defense-title">A detection earns its way into production</title><desc id="cyber-defense-desc">Observed behavior becomes an executable detection; validation closes the loop. Retest against independent attacks. Execute: A controlled attack produces observable behavior rather than a model&#x27;s self-reported success. Observe: Execution traces and telemetry provide the evidence used to reconstruct behavior. Generate: The defensive agent produces a query artifact that remains untrusted until checked. Verify: Syntax checks, telemetry replay, and independently seeded retesting govern promotion and further adaptation.</desc><style>
