<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" class="atlas-diagram" role="img" aria-labelledby="deepseek-v41-flash-title deepseek-v41-flash-desc"><title id="deepseek-v41-flash-title">Coordinate compute, sparse state, and decoding</title><desc id="deepseek-v41-flash-desc">The reconstructed report addresses repeated prefill, long-context KV state, and decode efficiency with complementary mechanisms. Conceptual mechanisms from the reconstructed technical report. Prefill: Conditional execution targets the repeated-prefill compute pressure described in long-horizon agent workloads. Sparse attention: CSA2 and hierarchical sparse indexing address layer-wise KV duplication and index-search work in the reconstructed architecture. KV storage: FP4 main KV and bounded replay for sliding-window state address different parts of runtime and persistent cache storage. Decode: DSpark targets decoding throughput while single-pass mHC addresses residual memory traffic; the article distinguishes their roles.</desc><style>
