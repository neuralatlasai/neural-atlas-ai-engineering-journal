<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" class="atlas-diagram" role="img" aria-labelledby="glm-experts-title glm-experts-desc"><title id="glm-experts-title">Large capacity, selective computation</title><desc id="glm-experts-desc">A token activates selected routed experts while a shared expert contributes alongside them. Illustrative branches; not the actual expert count. Token state: The router computes scores from the token&#x27;s decoder representation. Routed expert A: A selected expert applies its own gated feed-forward transformation. Shared expert: The shared expert participates independently of routed top-k selection. Routed expert B: Only selected routed experts are executed for this token; actual configuration is specified in the article. Combine: Weighted routed outputs are combined with the shared-expert result.</desc><style>
