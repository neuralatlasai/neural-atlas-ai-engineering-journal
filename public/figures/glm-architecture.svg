<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" class="atlas-diagram" role="img" aria-labelledby="glm-architecture-title glm-architecture-desc"><title id="glm-architecture-title">Extend context by changing how work is reused</title><desc id="glm-architecture-desc">Sparse attention, shared index selection, and expert computation cooperate in the decoder. A conceptual view of the article&#x27;s source-audited decoder. Token state: The decoder transforms input tokens through its configured block sequence. Latent attention: Latent KV storage and sparse attention selection reduce different costs of long-context processing. Index sharing: Full-indexer layers construct selections that eligible following layers reuse. Expert compute: Shared and selected routed experts supply feed-forward capacity without activating all parameters per token.</desc><style>
