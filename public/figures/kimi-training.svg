<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" class="atlas-diagram" role="img" aria-labelledby="kimi-training-title kimi-training-desc"><title id="kimi-training-title">Specialize policies, then consolidate behavior</title><desc id="kimi-training-desc">The reconstructed program branches into domain and effort policies before multi-policy distillation. Three domains shown; effort levels create further specialist branches. Foundation + SFT: Pretraining and supervised adaptation establish the policy used for specialist training. General: The general domain is trained under the source-defined effort configurations. General agent: Agentic tasks add environment and rollout state to the optimization program. Coding agent: Coding tasks form another specialist domain; effort settings further distinguish policies. Distill: Multi-policy on-policy distillation consolidates specialist behavior into the final program endpoint.</desc><style>
.atlas-diagram{color:var(--diagram-ink,#20342f);font-family:Arial,Helvetica,sans-serif}
.atlas-diagram .dv-paper{fill:var(--diagram-paper,#f5f7f2)}
.atlas-diagram .dv-line{fill:none;stroke:var(--diagram-line,#bcc9c0);stroke-width:1.5}
.atlas-diagram .dv-strong{fill:none;stroke:var(--diagram-accent,#286b54);stroke-width:2}
.atlas-diagram .dv-fill{fill:var(--diagram-accent,#286b54)}
.atlas-diagram .dv-soft{fill:var(--diagram-soft,#dce8dc)}
.atlas-diagram .dv-secondary{fill:var(--diagram-secondary,#ae663e)}
.atlas-diagram .dv-muted{fill:var(--diagram-muted,#586a61)}
.atlas-diagram .dv-label{fill:currentColor;font-size:18px;font-weight:600;letter-spacing:-.3px}
.atlas-diagram .dv-detail{fill:var(--diagram-muted,#586a61);font-size:13px}
.atlas-diagram .dv-index{fill:var(--diagram-muted,#586a61);font-family:monospace;font-size:12px;letter-spacing:2px}
.atlas-diagram .dv-flow{fill:none;stroke:var(--diagram-accent,#286b54);stroke-width:2;stroke-dasharray:5 12;opacity:.8}
