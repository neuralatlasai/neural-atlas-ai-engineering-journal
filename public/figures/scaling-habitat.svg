<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" class="atlas-diagram" role="img" aria-labelledby="scaling-habitat-title scaling-habitat-desc"><title id="scaling-habitat-title">Bound change, concurrency, and request work</title><desc id="scaling-habitat-desc">Habitat evolved from distributed client logic into a service with predictable online storage operations. Centralize change, control serving pressure, and bound online work. Client library: Storage routing changes originally required coordinated upgrades across independently deployed product services. Central service: Moving Habitat logic behind a service boundary centralized storage-platform changes and observability. Runtime + transport: Asyncio delay measurements, low worker concurrency, and Envoy connection pooling controlled distinct sources of serving pressure. NoSQL contract: Constrained online operations and local object-and-edge partitioning kept request work predictable; complex reads used a separate path.</desc><style>
.atlas-diagram{color:var(--diagram-ink,#20342f);font-family:Arial,Helvetica,sans-serif}
.atlas-diagram .dv-paper{fill:var(--diagram-paper,#f5f7f2)}
.atlas-diagram .dv-line{fill:none;stroke:var(--diagram-line,#bcc9c0);stroke-width:1.5}
.atlas-diagram .dv-strong{fill:none;stroke:var(--diagram-accent,#286b54);stroke-width:2}
.atlas-diagram .dv-fill{fill:var(--diagram-accent,#286b54)}
.atlas-diagram .dv-soft{fill:var(--diagram-soft,#dce8dc)}
.atlas-diagram .dv-secondary{fill:var(--diagram-secondary,#ae663e)}
.atlas-diagram .dv-muted{fill:var(--diagram-muted,#586a61)}
.atlas-diagram .dv-label{fill:currentColor;font-size:18px;font-weight:600;letter-spacing:-.3px}
.atlas-diagram .dv-detail{fill:var(--diagram-muted,#586a61);font-size:13px}
.atlas-diagram .dv-index{fill:var(--diagram-muted,#586a61);font-family:monospace;font-size:12px;letter-spacing:2px}
.atlas-diagram .dv-flow{fill:none;stroke:var(--diagram-accent,#286b54);stroke-width:2;stroke-dasharray:5 12;opacity:.8}
