<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" class="atlas-diagram" role="img" aria-labelledby="attention-families-title attention-families-desc"><title id="attention-families-title">Different ways to remember the same sequence</title><desc id="attention-families-desc">Attention architectures reorganize query heads and stored key–value information. Schematic mechanisms; no quantitative memory comparison. MHA: Multi-head attention supplies each query head with its own key and value projections. GQA: Grouped-query attention shares key and value heads across groups of query heads. RoPE: Rotary position embeddings rotate query and key components to encode positional relationships. MLA: Multi-head latent attention stores a compressed representation used to reconstruct attention information.</desc><style>
