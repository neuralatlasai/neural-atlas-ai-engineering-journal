<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" class="atlas-diagram" role="img" aria-labelledby="knowledge-algorithms-title knowledge-algorithms-desc"><title id="knowledge-algorithms-title">Trace an answer back to executable evidence</title><desc id="knowledge-algorithms-desc">A knowledge-agent stack connects provenance-aware retrieval with bounded execution and verification. Verified outcomes inform later retrieval and evaluation. Construct: Source revisions become graph facts, relationships, communities, and provenance-aware representations. Retrieve: Retrieval chooses relevant evidence within access and temporal constraints. Execute: The agent resolves tools and capabilities under explicit execution and authorization contracts. Verify: Verification links conclusions and effects to supporting evidence and execution traces.</desc><style>
.atlas-diagram{color:var(--diagram-ink,#20342f);font-family:Arial,Helvetica,sans-serif}
