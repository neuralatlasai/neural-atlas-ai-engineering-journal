<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" class="atlas-diagram" role="img" aria-labelledby="agent-orchestration-title agent-orchestration-desc"><title id="agent-orchestration-title">Delegate work. Keep accountability.</title><desc id="agent-orchestration-desc">A coordinator distributes bounded work and consolidates results against a shared objective. Delegated execution → independent results → consolidation. Coordinator: The parent runtime determines task decomposition, delegation constraints, and the available budget. Worker A: A delegated worker owns a bounded subtask and its local execution context. Worker B: Parallel work is useful when dependencies and result contracts are explicit. Worker C: Three workers illustrate topology, not a prescribed team size or vendor concurrency limit. Consolidate: The coordinator evaluates outcomes and integrates compatible results into the overall task.</desc><style>
.atlas-diagram{color:var(--diagram-ink,#20342f);font-family:Arial,Helvetica,sans-serif}
.atlas-diagram .dv-paper{fill:var(--diagram-paper,#f5f7f2)}
.atlas-diagram .dv-line{fill:none;stroke:var(--diagram-line,#bcc9c0);stroke-width:1.5}
.atlas-diagram .dv-strong{fill:none;stroke:var(--diagram-accent,#286b54);stroke-width:2}
.atlas-diagram .dv-fill{fill:var(--diagram-accent,#286b54)}
.atlas-diagram .dv-soft{fill:var(--diagram-soft,#dce8dc)}
.atlas-diagram .dv-secondary{fill:var(--diagram-secondary,#ae663e)}
.atlas-diagram .dv-muted{fill:var(--diagram-muted,#586a61)}
.atlas-diagram .dv-label{fill:currentColor;font-size:18px;font-weight:600;letter-spacing:-.3px}
.atlas-diagram .dv-detail{fill:var(--diagram-muted,#586a61);font-size:13px}
.atlas-diagram .dv-index{fill:var(--diagram-muted,#586a61);font-family:monospace;font-size:12px;letter-spacing:2px}
.atlas-diagram .dv-flow{fill:none;stroke:var(--diagram-accent,#286b54);stroke-width:2;stroke-dasharray:5 12;opacity:.8}
