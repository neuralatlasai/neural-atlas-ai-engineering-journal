<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" class="atlas-diagram" role="img" aria-labelledby="agent-context-title agent-context-desc"><title id="agent-context-title">Context is a working set, not a warehouse</title><desc id="agent-context-desc">Persistent resources and session history are selectively rendered into the active model context. Sources are selected and consolidated; they are not copied wholesale. Context policy: Context construction decides what to expose, retain, summarize, or retrieve. Files + repos: Mounted resources retain their own ownership, revision, and access semantics. Memory: Persistent memory is distinct from a session&#x27;s transient interaction window. History: Event history and execution state can inform future context without all being rendered at once. Active context: The model receives a selected working set subject to context size, relevance, and trust constraints.</desc><style>
.atlas-diagram{color:var(--diagram-ink,#20342f);font-family:Arial,Helvetica,sans-serif}
.atlas-diagram .dv-paper{fill:var(--diagram-paper,#f5f7f2)}
.atlas-diagram .dv-line{fill:none;stroke:var(--diagram-line,#bcc9c0);stroke-width:1.5}
.atlas-diagram .dv-strong{fill:none;stroke:var(--diagram-accent,#286b54);stroke-width:2}
.atlas-diagram .dv-fill{fill:var(--diagram-accent,#286b54)}
.atlas-diagram .dv-soft{fill:var(--diagram-soft,#dce8dc)}
.atlas-diagram .dv-secondary{fill:var(--diagram-secondary,#ae663e)}
.atlas-diagram .dv-muted{fill:var(--diagram-muted,#586a61)}
.atlas-diagram .dv-label{fill:currentColor;font-size:18px;font-weight:600;letter-spacing:-.3px}
.atlas-diagram .dv-detail{fill:var(--diagram-muted,#586a61);font-size:13px}
.atlas-diagram .dv-index{fill:var(--diagram-muted,#586a61);font-family:monospace;font-size:12px;letter-spacing:2px}
.atlas-diagram .dv-flow{fill:none;stroke:var(--diagram-accent,#286b54);stroke-width:2;stroke-dasharray:5 12;opacity:.8}
