<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" class="atlas-diagram" role="img" aria-labelledby="managed-runtime-title managed-runtime-desc"><title id="managed-runtime-title">From a model call to a persistent runtime</title><desc id="managed-runtime-desc">Definitions, environments, sessions, and event streams own different parts of agent execution. Events expose a session&#x27;s evolving execution state. Definition: The definition specifies intelligence, behavior, and capabilities. Environment: The environment specifies the resources and boundary of execution. Session: The session materializes work and owns evolving runtime state. Events: An event stream records work admission, interaction, outputs, and lifecycle transitions.</desc><style>
.atlas-diagram{color:var(--diagram-ink,#20342f);font-family:Arial,Helvetica,sans-serif}
